{% extends 'base.html' %}

{% block title %}
    Eliminar producto
{% endblock %}

{% block content %}

<div class="max-w-lg mx-auto">

    <div class="bg-white rounded-xl shadow p-8 text-center">

        <h1 class="text-2xl font-bold mb-4">
            Eliminar producto
        </h1>

        <p class="text-gray-600 mb-6">
            ¿Estás seguro de que quieres eliminar
            <strong>{{ object.nombre }}</strong>?
        </p>

        <form method="post">

            {% csrf_token %}

            <div class="flex justify-center gap-3">

                <button
                    type="submit"
                    class="bg-red-600 text-white px-5 py-2 rounded-lg hover:bg-red-700">

                    Sí, eliminar

                </button>

                <a
                    href="{% url 'producto-list' %}"
                    class="bg-gray-200 px-5 py-2 rounded-lg hover:bg-gray-300">

                    Cancelar

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
